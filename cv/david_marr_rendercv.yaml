cv:
  # Voice: plain English first; say what a non-specialist would recognize. Keep a few
  # standard tech names for search. Avoid acronym stacks (BFF, RBAC, RAG, MTTR, etc.)
  # unless paired with a plain-English gloss. Resume clichés: spearheaded→led, etc.
  #
  # Phone is intentionally omitted from git to reduce scraping/spam. To bake a
  # number into the PDF only, run: CV_PHONE="+1…" pnpm run cv:render
  # (E.164). Optional GitHub Actions secret CV_PHONE does the same in CI.
  #
  # --- Replace bracket placeholders before publishing (search for [N], [M], etc.) ---
  # Context Labs: Senior SE (Jun–Dec 2022) → Principal SE / Eng Lead (UI) (Dec 2022–Mar 2026).
  # Filtered.ai: employer framing set (large employers, financial services + technology).
  # Turo: availability, pricing, All-star; host platform React tooling.
  # Experience list starts at Tilt.com; earlier roles omitted from résumé.
  name: David Marr
  headline: AI Mountaineer
  location: "Boston, MA"
  email: "dave.marr@gmail.com"
  sections:
    summary:
      - I enjoy making things work, work well, and repairing them when they don't.
        Mostly software, but also relationships, bicycles, electronics — anything
        worth doing right.
      - Loyal to the craft, hard-working, and considerate, I try to do more with
        less, and maintain a beginner's curiosity.
    experience:
      - company: "Context Labs"
        position: "Principal Software Engineer / Engineering Lead (UI)"
        start_date: 2022-12
        end_date: 2026-03
        location: "Cambridge, MA"
        summary: "Led distributed UI/UX engineering organization delivering
          multi-tenant analytics platform."
        highlights:
          - Managed and grew UI/UX team across three continents; introduced
            OKRs and reviews improving velocity and reducing incident MTTR (time
            to restore service) by 50%.
          - Drove adoption of AI coding assistants and MCP extensions in our Nuxt
            stack, pairing hands-on workshops with clear review and testing
            guardrails so teams shipped safely at higher cadence.
      - company: "Context Labs"
        position: "Senior Software Engineer"
        start_date: 2022-06
        end_date: 2022-12
        location: "Cambridge, MA"
        highlights:
          - Developed shared UI component library with Vega Lite, MapBox, and
            accessible controls.
          - Built production BFF platform with GraphQL/Java, multi-tenancy, SSO,
            RBAC, and internationalization.

      - company: "Filtered.ai"
        position: "Lead Engineer"
        start_date: 2020-02
        end_date: 2022-02
        location: "Boston, MA"
        highlights:
          - Built AI tools to automate organization and grading of technical
            assessments for custom SaaS/ATS.
          - Implemented fraud and cheat detection using computer vision and AWS
            Mechanical Turk.
          - Managed full-stack implementation of hiring tools including
            scheduling, assessing/grading, interviewing, and workflow management.
      - company: "Turo"
        position: "Staff Software Engineer"
        start_date: 2018-04
        end_date: "2019-12"
        location: "Cambridge, MA"
        highlights:
          - "Owned trip management tools with dynamic pricing, improving host
            experience and utilization."
          - "Shipped UI and workflow updates for the All-star host program to
            recognize and incentivize top hosts, supporting retention and
            higher-quality listings."
      - company: "OneMarket / Westfield Labs"
        position: "Senior Software Architect"
        start_date: "2016-01"
        end_date: 2018-05
        location: "San Francisco, CA"
        highlights:
          - "Architected physical and online payment products, yielding ~$2.7m
            in MRR."
          - "Integrated facial recognition, subscription billing, and automated
            parking gates to produce a smart parking solution."
      - company: "Tilt.com"
        position: "Senior Systems Engineer"
        start_date: 2013-07
        end_date: 2015-12
        location: "San Francisco, CA"
        highlights:
          - Implemented and iterated a simplified contribution flow yielding 15%
            lift in site signups.
          - Pioneered server rendered React using reification with Perl/Dancer
            backend.
      - company: Various
        position: Previous Leadership & Technical Roles
        start_date: 2000-09
        end_date: 2013-04
        location: "Massachusetts & California"
        highlights:
          - Publishing and ad-tech at Say Media.
          - Co-founded an early social product (Secret Feature)
          - Design-to-production prototyping (Frog Design)
          - Scaled frontend architecture for high-traffic Yahoo properties
          - Webby-recognized career advice site (Monster.com)
          - Enterprise web integrations (SoftArtisans)
          - Industrial automation web interfaces and dashboards (GE Fanuc /
            Intellution)
        date: 2000-2013
    education:
      - institution: "University of New Hampshire"
        area: "Business Administration"
        degree: "BS"

        start_date: "1996-09"
        end_date: 2000-05
        location: "Durham, NH"
        summary: Focus on Management of Information Systems (MIS)
    skills:
      - label: Languages/Frameworks/Web
        details:
          TypeScript, JavaScript, Python, Go, React, Vue, HTML, CSS, Tailwind,
          Nuxt, Tanstack Start, Vega Lite, Mapbox, Maplibre, Deck.gl, D3, Zod,
          React Hook Form,
          Vee-Validate, WebGL, WebGPU, WebRTC
      - label: AI Tools/Infrastructure
        details: Kubernetes, AWS, PostgreSQL, Docker, Git, MongoDB, Bash, Trino,
          ArcadeDB, Vite, Vitest, Vercel AI SDK, Pi, Cursor, Opencode,
          Cloudflare Workers, Cloudflare Durable Objects, Agent Skills,
          Turborepo, Lerna/NX
  website: https://marr.github.io
  photo:
  social_networks:
    - network: GitHub
      username: marr
    - network: LinkedIn
      username: davidmarr
    - network: X
      username: dmarr

locale:
  language: english
  phrases:
    degree_with_area: "DEGREE"

design:
  theme: moderncv
  page:
    size: us-letter
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 79, 144)
    headline: rgb(0, 79, 144)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: Fontin
      name: Fontin
      headline: Fontin
      connections: Fontin
      section_titles: Fontin
    font_size:
      body: 10pt
      name: 25pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 4.15cm
    photo_position: left
    photo_space_left: 0cm
    photo_space_right: 0.3cm
    space_below_name: 0.7cm
    space_below_headline: 0.7cm
    space_below_connections: 0.7cm
    connections:
      phone_number_format: E164
      hyperlink: false
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ""
      space_between_connections: 0.33cm
  section_titles:
    type: moderncv
    line_thickness: 0.15cm
    space_above: 0.55cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.3cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.1cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0cm
      space_above: 0.15cm
      space_between_items: 0.1cm
      space_between_bullet_and_text: 0.3em
  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
