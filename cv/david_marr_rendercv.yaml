cv:
  # Voice: plain English first; say what a non-specialist would recognize. Keep a few
  # standard tech names for search. Avoid acronym stacks (BFF, RBAC, RAG, MTTR, etc.)
  # unless paired with a plain-English gloss. Resume clichés: spearheaded→led, etc.
  #
  # Phone is intentionally omitted from git to reduce scraping/spam. To bake a
  # number into the PDF only, run: CV_PHONE="+1…" pnpm run cv:render
  # (E.164). Optional GitHub Actions secret CV_PHONE does the same in CI.
  #
  # Per-role `skills` (comma-separated) → skills_block at render (see preprocess_cv_yaml.py).
  # Context Labs: one entry (Jun 2022–Mar 2026); progression in summary, not split roles.
  # Filtered.ai: employer framing set (large employers, financial services + technology).
  # Turo: availability, pricing, All-star; host platform React tooling.
  # Experience list starts at Tilt.com; earlier roles omitted from résumé.
  name: David Marr
  headline: Lead Software Engineer — Data Platforms, Analytics & Delivery
  location: "Boston, MA"
  email: "dave.marr@gmail.com"
  sections:
    summary:
      - Engineering leader who builds reliable data platforms and services —
        turning loosely defined product and analytics requirements into
        well-modeled, scalable systems teams can trust for reporting and
        day-to-day operations.
      - Twenty-five years shipping production software on Python, TypeScript,
        Node.js, AWS, and PostgreSQL. I lead in Agile teams, mentor engineers,
        and raise the bar on data quality, observability, and predictable
        delivery.
    experience:
      - company: "Context Labs"
        position: "Principal Software Engineer / Engineering Lead (Platform)"
        start_date: 2022-06
        end_date: 2026-03
        location: "Cambridge, MA"
        summary: "Led distributed engineering organization delivering a
          multi-tenant analytics platform — owning how data is modeled, accessed,
          and delivered across product, reporting, and geospatial use cases."
        skills: Python, Node.js, TypeScript, GraphQL, PostgreSQL, Trino, Vue,
          Nuxt, Mapbox
        highlights:
          - Managed and grew engineering team across three continents in Scrum
            delivery; introduced OKRs and operational reviews that improved
            velocity and cut incident recovery time by 50%.
          - Built production data-service layer in Node.js/TypeScript (GraphQL
            BFF) integrating with Java APIs — multi-tenancy, single sign-on,
            role-based access, and internationalization; the integration point
            for analytics, dashboards, and product features.
          - Partnered with product and analytics stakeholders to shape relational
            data models and APIs supporting reporting, charting (Vega Lite), and
            map-based visualization (Mapbox).
          - Established engineering standards — code review, testing, and
            monitoring practices — that improved data trust and reduced
            operational friction across the platform.
          - Mentored engineers and drove adoption of AI-assisted development
            workflows with hands-on workshops and clear quality guardrails.

      - company: "Filtered.ai"
        position: "Lead Engineer"
        start_date: 2020-02
        end_date: 2022-02
        location: "Boston, MA"
        summary: "Lead engineer building AWS-backed data and ML workflows for
          technical hiring assessments — ingestion, validation, scoring, and
          reporting for enterprise recruiting teams."
        skills: Python, AWS, PostgreSQL, Node.js, TypeScript, React
        highlights:
          - Built fraud and integrity detection pipelines using Python, computer
            vision, and AWS (including Mechanical Turk for human-in-the-loop
            validation).
          - Owned full-stack hiring platform on PostgreSQL — assessment data
            models, scheduling, grading workflows, and operational reporting.
          - Collaborated with product and data science on model integration,
            quality checks, and reliable delivery of automated scoring at scale.
      - company: "Turo"
        position: "Staff Software Engineer"
        start_date: 2018-04
        end_date: "2019-12"
        location: "Cambridge, MA"
        summary: Owned trip-management and dynamic pricing systems on
          PostgreSQL, improving host experience and fleet utilization through
          data-driven availability and rate logic.
        skills: PostgreSQL, React, Redux, TypeScript, JavaScript
        highlights:
          - "Maintained the All-star host program to recognize and incentivize
            top hosts, supporting retention and higher-quality listings."
          - "Partnered with product and operations on pricing and availability
            rules that depended on reliable transactional and reporting data."
      - company: "OneMarket / Westfield Labs"
        position: "Senior Software Architect"
        start_date: "2016-01"
        end_date: 2018-05
        location: "San Francisco, CA"
        summary: Integrated facial recognition, subscription billing, and automated
          parking gates into a smart parking platform with payment and usage
          data flowing through PostgreSQL-backed services.
        skills: PostgreSQL, Node.js, React, JavaScript, Stripe, Mapbox, C
        highlights:
          - "Architected physical and online payment products, yielding ~$2.7m
            in monthly recurring revenue with reliable billing and reporting
            data."
          - "Built indoor mapping, directory kiosks, and wayfinding systems
            across 4 flagship shopping centers, averaging 60,000+ monthly
            sessions with operational metrics for venue stakeholders."
      - company: "Tilt.com"
        position: "Senior Systems Engineer"
        start_date: 2013-07
        end_date: 2015-12
        location: "San Francisco, CA"
        skills: React, Perl, JavaScript, PostgreSQL
        highlights:
          - Implemented and iterated a simplified contribution flow yielding 15%
            lift in site signups.
          - Pioneered server rendered React using reification with Perl/Dancer
            backend.
      - company: Various
        position: Previous Leadership & Technical Roles
        start_date: 2000-09
        end_date: 2013-04
        location: "Massachusetts & California"
        skills: Node.js, Adobe Flash/Flex/FMS, MySQL, PHP, SQL Server, .NET,
          ASP Classic, HTML, CSS, JavaScript
        highlights:
          - Publishing and ad-tech at Say Media (audience data, campaign
            delivery, and content platforms); co-founded early social product
            (Secret Feature).
          - Design-to-production prototyping (Frog Design); scaled frontend
            architecture for high-traffic Yahoo properties.
          - Webby-recognized career advice site (Monster.com); enterprise web
            integrations (SoftArtisans).
          - Industrial automation web interfaces and dashboards (GE Fanuc /
            Intellution)
        date: 2000-2013
    education:
      - institution: "University of New Hampshire"
        area: "Business Administration"
        degree: "BS"

        start_date: "1996-09"
        end_date: 2000-05
        location: "Durham, NH"
        summary: Focus on Management of Information Systems (MIS)
    skills:
      - label: Data & Platform
        details: Python, Node.js, TypeScript, PostgreSQL, AWS, Trino, GraphQL,
          Docker, Kubernetes, MongoDB, Bash, Git
      - label: Languages/Frameworks/Web
        details:
          TypeScript, JavaScript, Go, React, Vue, HTML, CSS, Tailwind, Nuxt,
          Tanstack Start, Vega Lite, Mapbox, Maplibre, Deck.gl, D3, Zod, React
          Hook Form, Vee-Validate, WebGL, WebGPU, WebRTC
      - label: AI Tools/Infrastructure
        details: Vite, Vitest, Vercel AI SDK, Pi, Cursor, Opencode, Cloudflare
          Workers, Cloudflare Durable Objects, Agent Skills, Turborepo,
          Lerna/NX, ArcadeDB
  website: https://marr.github.io
  photo:
  social_networks:
    - network: GitHub
      username: marr
    - network: LinkedIn
      username: davidmarr
    - network: X
      username: dmarr

locale:
  language: english
  phrases:
    degree_with_area: "DEGREE in AREA"

design:
  theme: harvard
  page:
    size: us-letter
    show_footer: true
    show_top_note: false
  typography:
    alignment: left
  header:
    connections:
      phone_number_format: E164
      hyperlink: true
      show_icons: true
  sections:
    show_time_spans_in: []
  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION -- LOCATION
        SUMMARY
        HIGHLIGHTS
        SKILLS_BLOCK
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
