cv:
  # Tailored for Google Envisioning Studio — Creative Systems Engineer.
  # Source of truth for site build remains cv/david_marr_rendercv.yaml.
  name: David Marr
  headline: Creative Systems Engineer — AI Platforms, Infrastructure & Prototyping
  location: "Boston, MA"
  email: "dave.marr@gmail.com"
  sections:
    summary:
      - Systems engineer who builds the substrate underneath creative work —
        APIs, services, pipelines, and platform primitives that let designers,
        creative technologists, and product people prototype and ship faster.
      - Twenty-five years wiring production systems together on Python, TypeScript,
        Node.js, Docker, Kubernetes, and AWS. I treat agentic AI as a new
        programming primitive, run a home Kubernetes cluster to learn by doing,
        and am most at home in ambiguous, experiment-driven environments.
    experience:
      - company: "Context Labs"
        position: "Principal Software Engineer / Engineering Lead (Platform)"
        start_date: 2022-06
        end_date: 2026-03
        location: "Cambridge, MA"
        summary: "Built platform infrastructure for a multi-tenant analytics
          product — the APIs, services, and integration layer that product and
          visualization teams built on top of."
        skills: Python, Node.js, TypeScript, GraphQL, PostgreSQL, Docker,
          Kubernetes, Vue, Nuxt
        highlights:
          - Built production integration layer in Node.js/TypeScript (GraphQL
            BFF) wiring Java APIs, databases, auth, and localization into a
            single surface product teams could move on quickly.
          - Drove adoption of AI coding assistants and MCP tooling across the
            stack — hands-on workshops, review guardrails, and platform patterns
            so teams could experiment with agents without breaking production.
          - Shaped shared platform primitives (data access, charting with Vega
            Lite, geospatial with Mapbox) that reduced repeated plumbing work
            for feature teams.
          - Led distributed engineering across three continents; introduced
            lightweight delivery practices that improved velocity and cut
            incident recovery time by 50%.
          - Mentored engineers on systems thinking, service boundaries, and
            how to prototype safely against real infrastructure.

      - company: "Filtered.ai"
        position: "Lead Engineer"
        start_date: 2020-02
        end_date: 2022-02
        location: "Boston, MA"
        summary: "Lead engineer wiring models, services, and data pipelines
          into a hiring-assessment product on AWS and PostgreSQL."
        skills: Python, AWS, PostgreSQL, Node.js, TypeScript
        highlights:
          - Integrated computer-vision models and human-in-the-loop validation
            (AWS Mechanical Turk) into scoring pipelines that had to be reliable
            in production.
          - Built ingestion, scheduling, grading, and workflow services that
            connected product requirements to running infrastructure.
          - Partnered with data science on model deployment, quality checks, and
            operational monitoring for automated assessment at scale.

      - company: "Turo"
        position: "Staff Software Engineer"
        start_date: 2018-04
        end_date: "2019-12"
        location: "Cambridge, MA"
        summary: Owned backend systems for trip management and dynamic pricing
          on PostgreSQL — the machinery behind product-facing availability and
          rate logic.
        skills: PostgreSQL, TypeScript, JavaScript, React
        highlights:
          - "Maintained pricing and host-recognition systems where product rules
            depended on dependable service and data plumbing."
          - "Worked with product and operations to translate fuzzy requirements
            into shippable backend behavior."

      - company: "OneMarket / Westfield Labs"
        position: "Senior Software Architect"
        start_date: "2016-01"
        end_date: 2018-05
        location: "San Francisco, CA"
        summary: Wired together hardware, payments, and web services into a smart
          parking platform — facial recognition, billing, gates, and venue
          software talking through APIs and databases.
        skills: Node.js, PostgreSQL, C, JavaScript, Stripe, Mapbox
        highlights:
          - "Integrated disparate systems — cameras, payment rails, gate hardware,
            and web apps — into a product that generated ~$2.7m in monthly
            recurring revenue."
          - "Built indoor mapping and kiosk software across 4 flagship shopping
            centers, averaging 60,000+ monthly sessions."

      - company: "Tilt.com"
        position: "Senior Systems Engineer"
        start_date: 2013-07
        end_date: 2015-12
        location: "San Francisco, CA"
        skills: Perl, JavaScript, PostgreSQL, React
        highlights:
          - Pioneered server-rendered React integrated with a Perl/Dancer
            backend — early work bridging new UI patterns to existing services.
          - Implemented and iterated a simplified contribution flow yielding 15%
            lift in site signups.

      - company: Various
        position: Previous Leadership & Technical Roles
        start_date: 2000-09
        end_date: 2013-04
        location: "Massachusetts & California"
        skills: Node.js, JavaScript, MySQL, PHP, .NET, HTML, CSS
        highlights:
          - Design-to-production prototyping at Frog Design — translating
            creative concepts into working software under tight ambiguity.
          - Co-founded early social product (Secret Feature); publishing and
            ad-tech platform work at Say Media.
          - Scaled frontend architecture for high-traffic Yahoo properties;
            enterprise integrations and industrial automation dashboards.

        date: 2000-2013
    systems:
      - name: Personal homelab (Kubernetes / GitOps)
        summary: Self-hosted infrastructure lab documented on marr.github.io —
          Talos Linux, Flux, SOPS secrets, and service orchestration on a home
          cluster.
        highlights:
          - "Operate and evolve a Kubernetes cluster to understand containers,
            networking, storage, and GitOps reconciliation in practice."
          - "Built custom observability dashboards and agent-oriented runbooks
            so debugging stays fast as the environment grows."
    education:
      - institution: "University of New Hampshire"
        area: "Business Administration"
        degree: "BS"
        start_date: "1996-09"
        end_date: 2000-05
        location: "Durham, NH"
        summary: Focus on Management of Information Systems (MIS)
    skills:
      - label: Systems & Infrastructure
        details: Docker, Kubernetes, AWS, Python, Node.js, TypeScript,
          PostgreSQL, GraphQL, Bash, Git, MongoDB
      - label: AI, Agents & Prototyping
        details: Vercel AI SDK, MCP, Cursor, Opencode, Agent Skills, Cloudflare
          Workers, Cloudflare Durable Objects, Pi
      - label: Web & Visualization
        details: Vue, Nuxt, React, Vega Lite, Mapbox, D3, WebGL, WebRTC, Go
  website: https://marr.github.io
  photo:
  social_networks:
    - network: GitHub
      username: marr
    - network: LinkedIn
      username: davidmarr
    - network: X
      username: dmarr

locale:
  language: english
  phrases:
    degree_with_area: "DEGREE in AREA"

design:
  theme: harvard
  page:
    size: us-letter
    show_footer: true
    show_top_note: false
  typography:
    alignment: left
  header:
    connections:
      phone_number_format: E164
      hyperlink: true
      show_icons: true
  sections:
    show_time_spans_in: []
  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**, POSITION -- LOCATION
        SUMMARY
        HIGHLIGHTS
        SKILLS_BLOCK
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
